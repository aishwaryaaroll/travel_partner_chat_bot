[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
markers = ["live: calls the real Anthropic API (needs ANTHROPIC_API_KEY)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-include = ["../agents/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "src"]
